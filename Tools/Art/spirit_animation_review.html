<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>원혼 애니메이션 검수</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c23;color:#eee9dd;font:15px system-ui,sans-serif}main{max-width:1064px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 6px}p{margin:6px 0 16px;color:#b6bdc5}section{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}label{display:flex;gap:7px;align-items:center}button,select{font:inherit;color:inherit;background:#2d3642;border:1px solid #526070;border-radius:6px;padding:8px 12px}input[type=range]{width:260px}canvas{width:100%;height:auto;image-rendering:pixelated;background:#252934;border-radius:8px}#detail{min-height:40px;padding:10px 0;color:#e3c587}.small{color:#aeb8c5;font-size:13px}strong{color:#f4e4b4}
</style>
<main><h1>원혼 애니메이션 검수</h1><p>8방향을 같은 시계로 재생합니다. 청록 선은 발 기준점입니다.</p>
<section><label>캐릭터<select id="character" aria-label="캐릭터"></select></label><label>동작<select id="motion" aria-label="동작"></select></label><button id="play">일시정지</button><label>속도<select id="speed" aria-label="속도"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label><label><input type="checkbox" id="trail" checked>Trail 적용</label><label><input type="checkbox" id="return" checked>대기 전환 보기</label></section>
<section><label>프레임<input id="frame" type="range" min="0" max="7" value="0" aria-label="프레임"></label><strong id="time"></strong><span id="count" class="small"></span></section>
<canvas id="stage" width="1024" height="440"></canvas><div id="detail"></div><div class="small">자동 확인 표시는 검수할 지점입니다. 이동·도약·쓰러짐의 의도된 자세 변화와 구별해 판단해야 합니다. Trail 적용 프레임은 별도로 보존합니다.</div></main>
<script>
const D=__DATA__, $=id=>document.getElementById(id), cache=new Map();
for(const c of D.characters){const o=document.createElement('option');o.value=c.key;o.textContent=c.name;$('character').append(o)}
let entry,playing=true,epoch=performance.now(),fixed=0;
function image(src){if(!cache.has(src)){const im=new Image();im.src=src;cache.set(src,im)}return cache.get(src)}
function chooseMotion(){const key=$('character').value,old=$('motion').value;$('motion').replaceChildren();for(const c of D.clips.filter(c=>c.key===key)){const o=document.createElement('option');o.value=c.motion;o.textContent=c.motion;$('motion').append(o)}if([...$('motion').options].some(o=>o.value===old))$('motion').value=old;load()}
function load(){entry=D.clips.find(c=>c.key===$('character').value&&c.motion===$('motion').value);if(!entry)return;epoch=performance.now();fixed=0;$('frame').max=entry.directions[0].frames.length-1;for(const r of entry.directions)for(const p of [...r.frames,...r.trailFrames])image(p);$('count').textContent=`생성된 클립 ${D.availableClips}/440 · ${entry.fps} fps`;const flags=[...new Set(entry.directions.flatMap(d=>d.flags))];$('detail').textContent=flags.length?'확인할 지점: '+flags.join(' · '):'프레임 구조 검사에서 특별한 표시 없음 — 실제 움직임도 확인하세요.'}
function render(t){if(!entry){requestAnimationFrame(render);return}const frames=entry.directions[0].frames.length,fps=entry.fps,bodyTime=frames/fps,cycle=bodyTime+(entry.loop?0:.55),elapsed=(t-epoch)/1000*Number($('speed').value),phase=elapsed%cycle;let returnIdle=!entry.loop&&phase>=bodyTime&&$('return').checked;let f=playing?Math.min(frames-1,Math.floor(phase*fps)):fixed;if(!playing)returnIdle=false;const ctx=$('stage').getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#242933';ctx.fillRect(0,0,1024,440);const character=D.characters.find(c=>c.key===entry.key);for(let n=0;n<entry.directions.length;n++){const r=entry.directions[n],x=n%4*256,y=Math.floor(n/4)*220;ctx.save();ctx.beginPath();ctx.rect(x,y,256,220);ctx.clip();for(let cy=0;cy<11;cy++)for(let cx=0;cx<13;cx++){ctx.fillStyle=(cx+cy)%2?'#2a303b':'#242a34';ctx.fillRect(x+cx*20,y+cy*20,20,20)}let list=$('trail').checked&&r.trailFrames.length===frames?r.trailFrames:r.frames;let at=f;if(returnIdle){const idle=D.clips.find(c=>c.key===entry.key&&c.motion==='IDLE');list=idle?.directions.find(a=>a.direction===r.direction)?.frames||list;at=0}const im=image(list[at]);if(im.complete&&im.naturalWidth){const px=character.pivot.x+(im.width-(character.canvasWidth||64))/2,py=character.pivot.y+(im.height-(character.canvasHeight||64))/2;ctx.drawImage(im,x+128-px*2,y+176-(im.height-py)*2,im.width*2,im.height*2)}ctx.strokeStyle='#60bcb0';ctx.beginPath();ctx.moveTo(x+110,y+176);ctx.lineTo(x+146,y+176);ctx.moveTo(x+128,y+171);ctx.lineTo(x+128,y+181);ctx.stroke();ctx.fillStyle='#eee9dd';ctx.font='14px system-ui';ctx.fillText(r.direction,x+12,y+207);ctx.restore()}$('time').textContent=returnIdle?'대기 전환':`${f+1} / ${frames}`;if(playing)$('frame').value=f;requestAnimationFrame(render)}
$('character').onchange=chooseMotion;$('motion').onchange=load;$('play').onclick=()=>{playing=!playing;if(playing)epoch=performance.now()-fixed/entry.fps*1000;$('play').textContent=playing?'일시정지':'재생'};$('frame').oninput=()=>{playing=false;fixed=Number($('frame').value);$('play').textContent='재생'};$('speed').onchange=()=>epoch=performance.now();chooseMotion();requestAnimationFrame(render);
</script></html>
