: 10, "ref": 871012, "x": 35, "y": 33, "w": 1, "h": 1, "size": 4, "desc": "구간 2 팩 4 — 작(4체), 92101"}, {"id": 6510424, "map": 65104, "t": 9, "ref": 871012, "x": 16, "y": 29, "w": 12, "h": 9, "size": 0, "desc": "구간 2 교전 공간 5"}, {"id": 6510425, "map": 65104, "t": 10, "ref": 871012, "x": 19, "y": 33, "w": 1, "h": 1, "size": 6, "desc": "구간 2 팩 5 — 표준(6체), 92101"}, {"id": 6510426, "map": 65104, "t": 9, "ref": 871012, "x": 0, "y": 29, "w": 12, "h": 9, "size": 0, "desc": "구간 2 교전 공간 6"}, {"id": 6510427, "map": 65104, "t": 10, "ref": 871012, "x": 3, "y": 33, "w": 1, "h": 1, "size": 7, "desc": "구간 2 팩 6 — 큰(7체), 92101"}, {"id": 6510428, "map": 65104, "t": 17, "ref": 0, "x": 44, "y": 28, "w": 4, "h": 4, "size": 0, "desc": "골짜기(저승판)"}, {"id": 6510429, "map": 65104, "t": 17, "ref": 0, "x": 44, "y": 35, "w": 4, "h": 4, "size": 0, "desc": "골짜기(저승판)"}, {"id": 6510430, "map": 65104, "t": 5, "ref": 62102, "x": 44, "y": 32, "w": 4, "h": 3, "size": 0, "desc": "망자의 다리 — 이승의 무너진 나무다리. 폭 3칸"}, {"id": 6510431, "map": 65104, "t": 16, "ref": 871013, "x": 1, "y": 39, "w": 3, "h": 1, "size": 0, "desc": "붉은 실 장막 — 구간 2 정리 후 걷힌다"}, {"id": 6510432, "map": 65104, "t": 8, "ref": 0, "x": 1, "y": 39, "w": 5, "h": 9, "size": 0, "desc": "연결로 2. 폭 5칸"}, {"id": 6510433, "map": 65104, "t": 4, "ref": 51103, "x": 3, "y": 41, "w": 1, "h": 1, "size": 0, "desc": "붉은 실의 끝(저승 발견) — 실이 땅에 묶인 혼에 닿는다. 팩 정리 뒤 지나는 통로"}, {"id": 6510434, "map": 65104, "t": 8, "ref": 871013, "x": 1, "y": 47, "w": 20, "h": 8, "size": 0, "desc": "산신당 앞마당(저승판)"}, {"id": 6510435, "map": 65104, "t": 12, "ref": 871013, "x": 15, "y": 50, "w": 1, "h": 1, "size": 0, "desc": "구간 불씨 — 이승 산신당 신단 자리. 주변 5×5 적 없음"}, {"id": 6510436, "map": 65104, "t": 16, "ref": 871014, "x": 21, "y": 50, "w": 1, "h": 3, "size": 0, "desc": "보스방 입구 — 교전 시작 시 닫힌다"}, {"id": 6510437, "map": 65104, "t": 13, "ref": 871014, "x": 22, "y": 44, "w": 19, "h": 13, "size": 0, "desc": "목귀 아레나 19×13 — 카메라 고정. 장애물 없음"}, {"id": 6510438, "map": 65104, "t": 14, "ref": 3000101, "x": 31, "y": 49, "w": 2, "h": 2, "size": 0, "desc": "뒤틀린 목귀(2×2). 가로 중앙, 세로 중앙보다 1칸 위 — 이승 산신 고목 자리"}, {"id": 6510439, "map": 65104, "t": 15, "ref": 871014, "x": 23, "y": 55, "w": 1, "h": 1, "size": 0, "desc": "보스방 불씨(2회). 목귀에서 8칸"}]};
const T={};D.types.forEach(t=>T[t.id]=t);
const hidden=new Set();
let cur=D.maps[0].id, mouse=null, focus=null;
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),tip=document.getElementById('tip');
function cellSize(m){const avail=Math.min(1040,window.innerWidth-40-(window.innerWidth>1200?320:0));return Math.max(4,Math.min(16,Math.floor(Math.min(avail/m.w,640/m.h))))}
function shortName(o){
  const t=T[o.t].name;
  if(t==='Pack')return o.size+'체';
  if(t==='NPC'||t==='Clue'||t==='Passage'||t==='Altar')return String(o.ref||'');
  if(t==='BossStart')return '보스';if(t==='Elite')return '정예';
  if(t==='Bonfire'||t==='ArenaBonfire')return '불씨';
  if(t==='PlayerStart')return '시작';
  return '';
}
const ORDER=[17,8,13,9,7,18,6,5,16,2,3,4,12,15,10,11,14,1];
function draw(){
  const m=D.maps.find(x=>x.id===cur), s=cellSize(m);
  cv.width=m.w*s; cv.height=m.h*s;
  cx.fillStyle=m.kind===2?'#120d16':'#18201a';cx.fillRect(0,0,cv.width,cv.height);
  const objs=D.objs.filter(o=>o.map===cur&&!hidden.has(o.t)).sort((a,b)=>ORDER.indexOf(a.t)-ORDER.indexOf(b.t));
  for(const o of objs){
    const t=T[o.t];cx.globalAlpha=[8,9,13,17,18,7].includes(o.t)?(o.t===9?.55:o.t===7?.35:.9):1;
    cx.fillStyle=(o===focus)?'#ffffff':t.color;
    cx.fillRect(o.x*s,o.y*s,o.w*s,o.h*s);
    cx.globalAlpha=1;
    if([10,14,2,4,3,12,15,1].includes(o.t)){cx.strokeStyle='#000';cx.lineWidth=1;cx.strokeRect(o.x*s+.5,o.y*s+.5,o.w*s-1,o.h*s-1)}
  }
  if(document.getElementById('oDetect').checked&&!hidden.has(10)){
    cx.strokeStyle='rgba(255,90,90,.55)';cx.setLineDash([4,3]);
    for(const o of objs.filter(o=>o.t===10)){const r=10;cx.strokeRect((o.x-r)*s,(o.y-r)*s,(2*r+1)*s,(2*r+1)*s)}
    cx.setLineDash([]);
  }
  if(document.getElementById('oGrid').checked&&s>=8){
    cx.strokeStyle='rgba(255,255,255,.05)';cx.beginPath();
    for(let x=0;x<=m.w;x++){cx.moveTo(x*s+.5,0);cx.lineTo(x*s+.5,m.h*s)}
    for(let y=0;y<=m.h;y++){cx.moveTo(0,y*s+.5);cx.lineTo(m.w*s,y*s+.5)}
    cx.stroke();
  }
  if(document.getElementById('oLabel').checked){
    cx.font='bold '+Math.max(9,s-3)+'px Malgun Gothic';cx.textBaseline='bottom';
    for(const o of objs){const n=shortName(o);if(!n)continue;
      cx.fillStyle='#000';cx.fillText(n,o.x*s+1,o.y*s);cx.fillStyle='#f4ecda';cx.fillText(n,o.x*s,o.y*s-1)}
  }
  if(mouse&&document.getElementById('oScreen').checked){
    cx.strokeStyle='rgba(120,200,255,.8)';cx.lineWidth=2;
    cx.strokeRect((mouse.x-14.5)*s,(mouse.y-7.94)*s,30*s,16.875*s);cx.lineWidth=1;
    cx.fillStyle='rgba(120,200,255,.9)';cx.fillRect(mouse.x*s,mouse.y*s,s,s);
  }
  document.getElementById('mname').textContent=m.name+' ('+m.id+')';
  document.getElementById('mdesc').textContent=m.desc;
  document.getElementById('msize').textContent=m.w+'×'+m.h+'칸 · 진행 '+m.dir+' · 카메라 '+(m.cam===1?'플레이어 중심':'구간 플레이어 중심 / 보스방 고정');
}
function buildSide(){
  const lg=document.getElementById('legend');lg.innerHTML='';
  const used=new Set(D.objs.filter(o=>o.map===cur).map(o=>o.t));
  D.types.filter(t=>used.has(t.id)).forEach(t=>{
    const l=document.createElement('label');l.title=t.desc;
    l.innerHTML='<input type="checkbox" '+(hidden.has(t.id)?'':'checked')+'><span class="sw" style="background:'+t.color+'"></span>'+t.name;
    l.querySelector('input').onchange=e=>{e.target.checked?hidden.delete(t.id):hidden.add(t.id);draw()};
    lg.appendChild(l)});
  const li=document.getElementById('list');li.innerHTML='';
  D.objs.filter(o=>o.map===cur&&![8,9].includes(o.t)).forEach(o=>{
    const d=document.createElement('div');d.textContent=o.id+' · '+T[o.t].name+(o.ref?' '+o.ref:'')+' · ('+o.x+','+o.y+')';
    d.title=o.desc;d.onmouseenter=()=>{focus=o;draw()};d.onmouseleave=()=>{focus=null;draw()};li.appendChild(d)});
}
function tabs(){
  const tb=document.getElementById('tabs');tb.innerHTML='';
  D.maps.forEach(m=>{const b=document.createElement('button');b.textContent=m.name;b.className=m.id===cur?'on':'';
    b.onclick=()=>{cur=m.id;focus=null;tabs();buildSide();draw()};tb.appendChild(b)});
}
cv.addEventListener('mousemove',e=>{
  const m=D.maps.find(x=>x.id===cur),s=cellSize(m),r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/s),y=Math.floor((e.clientY-r.top)/s);mouse={x,y};
  const hits=D.objs.filter(o=>o.map===cur&&!hidden.has(o.t)&&x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h).sort((a,b)=>ORDER.indexOf(b.t)-ORDER.indexOf(a.t));
  if(hits.length){const o=hits[0];tip.style.display='block';
    tip.innerHTML='<b>'+T[o.t].name+(o.ref?' · '+o.ref:'')+'</b> <span class="coord">#'+o.id+' ('+o.x+','+o.y+') '+o.w+'×'+o.h+(o.size?' · '+o.size+'체':'')+'</span><br>'+o.desc;
    tip.style.left=Math.min(e.clientX-r.left+14,cv.width-320)+'px';tip.style.top=(e.clientY-r.top+14)+'px';}
  else tip.style.display='none';
  draw();
});
cv.addEventListener('mouseleave',()=>{mouse=null;tip.style.display='none';draw()});
['oDetect','oScreen','oGrid','oLabel'].forEach(id=>document.getElementById(id).onchange=draw);
window.addEventListener('resize',draw);
tabs();buildSide();draw();
</script>
