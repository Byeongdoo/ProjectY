  add(1,g+1,0);add(2,g,e+1);add(5,g+1,0);add(3,g-1,3);add(4,g,0);add(2,g-1,5);add(1,g,0);add(5,g,2);add(4,g+1,0);

  $('popEnd').classList.add('on');$('holdBar').style.width='0'}
function retCard(){const ch=+$('dCh').value;const d=D.dungeons.filter(x=>x.ch===ch).slice(-1)[0];const pz=D.clues.filter(c=>c.ch===ch&&c.world==='Underworld'&&c.puzzle!=='None');
  $('retCard').innerHTML=`<h2>귀항 — ${d.name}</h2><p class="dim">처음 클리어: 이야기 장면(개인 화면) → 아래 정리 → 삼천도 나루터</p>
   <div class="box" style="margin-bottom:8px"><h3>얻은 것</h3><div>경험치 · 혼백 · 장비 ${3+ch}개 (모두 개인 굴림)</div><div class="dim">처치 퀘스트 집계는 파티원 모두 같이</div></div>
   ${pz.length?`<div class="box" style="margin-bottom:8px"><h3>목격한 것</h3>${pz.map(c=>`<div class="li">${c.name}<small>${c.desc}</small></div>`).join('')}<span class="btn" id="rSolve">Enter 지금 풀기</span><span class="btn" id="rLater">Esc 나중에(사건 수첩)</span></div>`:'<p>목격한 퍼즐 없음</p>'}
   <span class="btn" id="rClose">삼천도로</span>`;
  $('popRet').classList.add('on');
  const close=()=>{$('popRet').classList.remove('on');render()};$('rClose').onclick=close;
  if($('rSolve')){$('rSolve').onclick=()=>{pz.forEach(c=>S.solved.add(c.id));close()};$('rLater').onclick=close}}
document.addEventListener('keydown',e=>{
  if($('popEnd').classList.contains('on')){if(e.key==='Escape'){$('popEnd').classList.remove('on');clearInterval(holdT)}
    if(e.key==='Enter'&&!holdT){holdStart=Date.now();holdT=setInterval(()=>{const p=(Date.now()-holdStart)/(D.cfg.hold*1000);$('holdBar').style.width=Math.min(100,p*100)+'%';
      if(p>=1){clearInterval(holdT);holdT=null;$('endList').innerHTML='<div class="li">결말 선택 화면으로 — 끊는다 / 잇는다</div>'}},50)}return}
  if($('popRet').classList.contains('on')){if(e.key==='Escape'&&$('rLater'))$('rLater').click();else if(e.key==='Enter'&&$('rSolve'))$('rSolve').click();else if(e.key==='Escape')$('rClose').click();return}
  const k=e.key.toLowerCase();const map={i:'bag',k:'spirit',j:'case',l:'journey'};
  if(map[k]){if(S.open&&S.tab===map[k])S.open=false;else{S.open=true;S.tab=map[k]}S.msg='';render();e.preventDefault();return}
  if(!S.open)return;
  if(e.key==='Escape'){S.open=false;render();return}
  if(k==='q'||k==='e'){const i=TABS.findIndex(t=>t[0]===S.tab);S.tab=TABS[(i+(k==='e'?1:TABS.length-1))%TABS.length][0];S.msg='';render();return}
  if(S.tab==='bag'){if(e.key==='Enter')doEquip();if(k==='u')doEnch();if(k==='x')doDis();
    if(e.key.startsWith('Arrow')&&S.sel.kind==='bag'){const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-8,ArrowDown:8}[e.key];S.sel.i=Math.max(0,Math.min(D.cfg.bag-1,S.sel.i+d));S.msg='';render();e.preventDefault()}}
  if(S.tab==='spirit'){if(/^[1-5]$/.test(e.key)){S.sp=+e.key-1;S.msg='';render()}if(k==='r')respec();if(e.key==='Enter')learn();
    if(e.key.startsWith('Arrow')){const sp=D.spirits[S.sp];const ns=D.nodes.filter(n=>D.skills.find(s=>s.id===n.skill).spirit===sp.id).sort((a,b)=>a.id-b.id);let i=Math.max(0,ns.findIndex(n=>n.id===S.nsel));
      i={ArrowLeft:i-1,ArrowRight:i+1,ArrowUp:i-3,ArrowDown:i+3}[e.key];S.nsel=ns[Math.max(0,Math.min(ns.length-1,i))].id;render();e.preventDefault()}}
});
['dSpace','dLv'].forEach(id=>$(id).onchange=()=>{S.msg='';render()});$('dCh').onchange=reset;
$('dReset').onclick=reset;$('dEnd').onclick=openEnd;$('dRet').onclick=retCard;
reset();
</script>
</body>
</html>
